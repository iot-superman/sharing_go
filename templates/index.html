🚕 計程車</option><option value="drive">🚗 自駕</option></select></div><div class="col-md-6"><label>預估總車資</label><input id="fare" type="number" value="120" class="form-control"></div><div class="col-12"><label>備註</label><textarea id="note" class="form-control"></textarea></div></div><div id="createStatus" class="small mt-2"></div><button id="createRideBtn" class="btn btn-success btn-lg mt-3" onclick="createRide()">建立共乘</button></div></section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><script>
const API='/api';let cid=localStorage.cg_cid||('web-'+crypto.randomUUID());localStorage.cg_cid=cid;let me=null,active=null,homeMap=null,pickMap=null,pickMarker=null,pickTarget='',coords={meet:null,dest:null},markers={},routeLayer=null;
// 2026-10-05：MQTT 即時聊天。Django 仍負責永久保存，MQTT 只做即時通知，斷線也不會丟歷史訊息。
const MQTT_BROKER=localStorage.getItem('cg_mqtt_broker')||'wss://broker.emqx.io:8084/mqtt';
const MQTT_ROOT='carpool-go/v1';
let mqttClient=null,mqttRideId=null,mqttConnected=false,mqttGeneration=0,chatSeenIds=new Set(),unreadCount=0,unreadRideId=null;
let liveLocationCache=new Map();let lastLocationPublishAt=0;let lastBrowserLocation=null;let geoWatchId=null;let homeMapRideId=null;let homeRouteBounds=null;
// 2026-10-05 vNext：降低 Render/PostgreSQL 負載。
// GPS 至少移動 15m 才寫 DB；即使瀏覽器連續回報相同座標，也不會反覆 POST。
// force=true 僅用於「剛加入行程」等需要立刻補送目前位置的情境。
const GPS_MIN_MOVE_METERS=15;
const GPS_MIN_SAVE_INTERVAL_MS=3000;
let lastSavedLocation=null;
let lastLocationSaveAt=0;
let locationSaveBusy=false;

// 單一 scheduler + 各 API 自己的節流時間，避免切換 Tab 時產生重複 timer。
const POLL_TRIP_MS=5000;
const POLL_LOCATIONS_MS=3000;
const POLL_MESSAGES_MS=5000;
const POLL_RIDES_MS=5000;
let pollTimerId=null;
let lastTripPollAt=0,lastLocationsPollAt=0,lastMessagesPollAt=0,lastRidesPollAt=0;
// 2026-10-05：找共乘卡片 / 我的行程都要有小型路線預覽地圖。
let miniMaps={};
let tripMiniMap=null;
let tripRenderSignature='';
let tripMapResizeObserver=null;
let tripMapRefitTimer=null;
const miniRouteCache=new Map();
// 2026-10-05 修正：所有 API 加入逾時，避免網路/後端異常時 UI 永遠卡在「建立中…」。
async function api(path,opt={}){
  const timeoutMs=opt.timeoutMs ?? 12000;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  const fetchOpt={...opt};
  delete fetchOpt.timeoutMs;
  fetchOpt.signal=controller.signal;
  fetchOpt.headers={...(fetchOpt.headers||{}),'X-Client-ID':cid,'Content-Type':'application/json'};
  try{
    const r=await fetch(API+path,fetchOpt);
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(j.error||`${r.status} ${r.statusText}`);
    return j;
  }catch(e){
    if(e?.name==='AbortError')throw Error(`連線逾時（${Math.round(timeoutMs/1000)} 秒），請確認 Django 終端機是否仍在執行。`);
    throw e;
  }finally{
    clearTimeout(timer);
  }
}
// 2026-10-05：雙底圖模式。
// 1) OpenStreetMap 官方圖磚：不需要 API Key。
// 2) CARTO Voyager：2026/09/23 起需要 API Key；Key 只存在瀏覽器 localStorage，不寫進原始碼。
// 若 OSM 圖磚載入失敗，且使用者已設定 CARTO Key，會自動切到 CARTO。
const MAP_PREF_KEY='cg_map_provider';
const CARTO_KEY_STORE='cg_carto_basemap_key';
const CARTO_DEFAULT_KEY='cb1_49xm_1_1390d1f34437d235ad84dc11'; // 預設 CARTO Basemaps Key；localStorage 可覆寫

function getCartoKey(){return (localStorage.getItem(CARTO_KEY_STORE)||CARTO_DEFAULT_KEY||'').trim()}
function setCartoKey(){
  const old=getCartoKey();
  const key=prompt('貼上 CARTO Basemaps API Key（只會儲存在這台瀏覽器）',old);
  if(key===null)return;
  const v=key.trim();
  if(v)localStorage.setItem(CARTO_KEY_STORE,v);else localStorage.removeItem(CARTO_KEY_STORE);
  alert(v?'CARTO Key 已儲存。重新開啟地圖即可使用 CARTO Voyager。':'CARTO Key 已清除。');
}
function makeOsmLayer(){
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  });
}
function makeEsriLayer(){
  // 第三備援底圖：當 OSM 回 403、CARTO 也不可用時自動切換。
  return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:19,
    attribution:'Tiles &copy; Esri'
  });
}
function makeCartoLayer(){
  const key=getCartoKey();
  if(!key)return null;
  return L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(key)}`,{
    maxZoom:20,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attribution/" target="_blank" rel="noopener">CARTO</a>'
  });
}
function showMapProviderNotice(m,text){
  try{
    const box=L.control({position:'bottomleft'});
    box.onAdd=()=>{
      const div=L.DomUtil.create('div','map-provider-notice');

function addDualBasemap(m){
  const osm=makeOsmLayer();
  const carto=makeCartoLayer();
  const esri=makeEsriLayer();
  const bases={'🗺️ OpenStreetMap':osm,'🌐 Esri World Street Map':esri};
  if(carto)bases['🚗 CARTO Voyager']=carto;

  const pref=localStorage.getItem(MAP_PREF_KEY);
  // Render/目前瀏覽器環境的 OSM volunteer tiles 會回 403。
  // 未曾手動選擇底圖時直接使用 Esri，避免先畫滿 403 blocked 圖磚。
  // 若使用者明確選 CARTO/Esri 則尊重選擇；舊的 osm 偏好也自動升級到 Esri。
  let current=(pref==='carto'&&carto)?carto:esri;
  if(pref==='osm')localStorage.setItem(MAP_PREF_KEY,'esri');
  current.addTo(m);

  const ctl=L.control.layers(bases,null,{collapsed:true,position:'topright'}).addTo(m);
  let switching=false,osmErrors=0,cartoErrors=0,esriErrors=0;
  let osmFallbackTimer=null;

  function removeBases(){
    for(const layer of [osm,carto,esri])if(layer&&m.hasLayer(layer))m.removeLayer(layer);
  }
  function switchTo(layer,name,key,reason){
    if(!layer||switching||m.hasLayer(layer))return;
    switching=true;
    try{
      removeBases();
      layer.addTo(m);
      current=layer;
      localStorage.setItem(MAP_PREF_KEY,key);
      showMapProviderNotice(m,`${reason}，已切換 ${name}`);
      setTimeout(()=>{try{m.invalidateSize({pan:false,animate:false})}catch(e){}},80);
    }finally{
      setTimeout(()=>{switching=false},500);
    }
  }

  m.on('baselayerchange',e=>{
    current=e.layer;
    if(e.layer===carto)localStorage.setItem(MAP_PREF_KEY,'carto');
    else if(e.layer===esri)localStorage.setItem(MAP_PREF_KEY,'esri');
    else localStorage.setItem(MAP_PREF_KEY,'osm');
  });

  // Leaflet 的 tileerror 無法直接可靠讀到 HTTP status，但 403/404/網路失敗都會進這裡。
  // OSM 一旦連續錯誤，優先 CARTO；沒有 CARTO Key 時直接切 Esri。
  osm.on('tileerror',()=>{
    osmErrors++;
    if(!m.hasLayer(osm))return;
    const fallback=esri;
    const fallbackName='Esri World Street Map';
    const fallbackKey='esri';
    if(osmErrors>=2){
      if(osmFallbackTimer)clearTimeout(osmFallbackTimer);
      switchTo(fallback,fallbackName,fallbackKey,'OSM 圖磚遭封鎖或載入失敗');
      return;
    }
    if(!osmFallbackTimer){
      osmFallbackTimer=setTimeout(()=>{
        if(osmErrors>0&&m.hasLayer(osm))switchTo(fallback,fallbackName,fallbackKey,'OSM 圖磚遭封鎖或載入失敗');
      },180);
    }
  });
  osm.on('tileload',()=>{
    osmErrors=0;
    if(osmFallbackTimer){clearTimeout(osmFallbackTimer);osmFallbackTimer=null;}
  });

  // CARTO 失敗時不要再切回已經 403 的 OSM，直接改用 Esri。
  if(carto){
    carto.on('tileerror',()=>{
      cartoErrors++;
      if(cartoErrors>=2&&m.hasLayer(carto))switchTo(esri,'Esri World Street Map','esri','CARTO 圖磚載入失敗');
    });
    carto.on('tileload',()=>{cartoErrors=0});
  }

  // Esri 若也暫時失敗，只在 OSM 沒有已知錯誤時才回 OSM，避免 OSM↔Esri 無限切換。
  esri.on('tileerror',()=>{
    esriErrors++;
    if(esriErrors>=3&&m.hasLayer(esri)&&osmErrors===0) switchTo(osm,'OpenStreetMap','osm','Esri 圖磚載入失敗');
  });
  esri.on('tileload',()=>{esriErrors=0});

  return {osm,carto,esri,ctl};
}

function tab(id){
  ['home','find','create','trip','chat'].forEach(x=>document.getElementById(x).style.display=x===id?'':'none');
  document.querySelectorAll('.navx button').forEach((b,i)=>b.classList.toggle('on',['home','find','create','trip','chat'][i]===id));

  if(id==='chat')clearUnread();
  if(id==='find')loadRides();

  if(id==='trip'||id==='home'||id==='chat'){
    loadTrip().then(()=>{
      // 2026-10-05：Leaflet 若在隱藏 section(display:none) 中初始化，
      // iPhone/Chrome 可能只畫左上角或一條圖磚。
      // 切到「行程」真正可見後才建立/刷新小地圖。
      if(id==='trip'){
        // 「我的行程」只顯示自己已建立或已加入的共乘。
        // 若目前沒有 active ride，代表使用者尚未加入任何共乘；
        // 直接帶到「找共乘」並重新抓 /api/rides/，避免誤以為其他裝置建立的共乘不存在。
        if(!active){
          tab('find');
          return;
        }

        // iPhone/LINE 最穩定策略：
        // 每次真正進入行程頁時重建一次 map；停留頁面期間不再重建。
        recreateTripMiniMapVisible().catch(e=>console.warn('recreate trip map failed',e));
      }
      if(id==='home'){
        requestAnimationFrame(()=>{
          setTimeout(()=>{try{homeMap?.invalidateSize(true)}catch(e){}},80);
        });
      }
    }).catch(e=>console.warn('tab loadTrip failed',e));
  }
}

// 2026-10-05：卡片預覽若是舊資料沒有座標，會用地址文字做一次 Nominatim 正向查詢。
// 因此「找共乘」清單不論新舊資料都會盡量顯示地圖預覽。
const geocodeCache=new Map();
async function resolveRidePoint(point){
  if(point&&point.lat!=null&&point.lng!=null)return {lat:+point.lat,lng:+point.lng,name:point.name};
  const q=(point?.name||'').trim();
  if(!q)return null;
  if(geocodeCache.has(q))return geocodeCache.get(q);
  try{
    const j=await api(`/geocode/?q=${encodeURIComponent(q)}`,{method:'GET',timeoutMs:10000});
    const v={lat:+j.lat,lng:+j.lng,name:j.displayName||q};
    geocodeCache.set(q,v);return v;
  }catch(e){console.warn('forward geocode failed',q,e);return null;}
}

// 2026-10-05：恢復「找共乘」卡片內的道路路線小圖。
// 小圖使用和首頁相同的 OSM/CARTO 雙底圖與 Django /api/route/，但關閉拖曳/縮放以免卡片滑動時誤操作。
async function renderStaticRouteMiniMap(opts){
  const {mapEl,summaryEl,ride,mapStoreKey='default',allowMove=false}=opts||{};
  const el=typeof mapEl==='string'?document.getElementById(mapEl):mapEl;
  const summary=typeof summaryEl==='string'?document.getElementById(summaryEl):summaryEl;
  if(!el||!ride)return;

  const a=await resolveRidePoint(ride.meeting),b=await resolveRidePoint(ride.destination);
  if(!a||!b){
    if(summary){summary.classList.add('text-warning');summary.textContent='⚠️ 找不到集合點或目的地座標，無法顯示路線預覽。';}
    return;
  }
  if(!document.body.contains(el))return;

  if(mapStoreKey==='trip'){ if(tripMiniMap){ try{tripMiniMap.remove()}catch(e){}; tripMiniMap=null; } }
  else if(miniMaps[mapStoreKey]){ try{miniMaps[mapStoreKey].remove()}catch(e){}; delete miniMaps[mapStoreKey]; }

  const m=L.map(el,{
    zoomControl:false,
    attributionControl:true,
    dragging:!!allowMove,
    scrollWheelZoom:!!allowMove,
    doubleClickZoom:!!allowMove,
    boxZoom:false,
    keyboard:false,
    tap:false,
    touchZoom:!!allowMove
  });
  if(mapStoreKey==='trip')tripMiniMap=m; else miniMaps[mapStoreKey]=m;
  addDualBasemap(m);

  const start=[+a.lat,+a.lng], end=[+b.lat,+b.lng];
  const startIcon=L.divIcon({className:'',html:'<div class="start-goal-icon">🚩</div>',iconSize:[34,34],iconAnchor:[9,30]});
  const goalIcon=L.divIcon({className:'',html:'<div class="goal-marker-wrap"><div class="goal-marker-flag">🏁</div><div class="goal-marker-label">終</div></div>',iconSize:[40,40],iconAnchor:[20,35]});
  L.marker(start,{interactive:false,icon:startIcon,zIndexOffset:700}).addTo(m).bindTooltip('🚩 起點');
  L.marker(end,{interactive:false,icon:goalIcon,zIndexOffset:700}).addTo(m).bindTooltip('終｜🏁 Goal');

  // 2026-10-05 iPhone 12 mini / 小尺寸瀏覽器修正：
  // Leaflet 在 iOS Safari / LINE WebView 的網址列高度變動時，
  // 容器剛顯示那一瞬間的 clientWidth/clientHeight 可能還不是最終值。
  // 如果此時直接 fitBounds，地圖會被 fit 到錯誤 viewport，
  // 結果就是「底圖有出來，但路線/旗子跑到畫面外」。
  m._cgFallbackBounds=L.latLngBounds([start,end]);
  m._cgRouteBounds=null;

  const key=[(+a.lat).toFixed(6),(+a.lng).toFixed(6),(+b.lat).toFixed(6),(+b.lng).toFixed(6)].join(',');
  try{
    let j=miniRouteCache.get(key);
    if(!j){
      const q=`/route/?start_lat=${encodeURIComponent(a.lat)}&start_lng=${encodeURIComponent(a.lng)}&end_lat=${encodeURIComponent(b.lat)}&end_lng=${encodeURIComponent(b.lng)}`;
      j=await api(q,{method:'GET',timeoutMs:12000});
      miniRouteCache.set(key,j);
    }
    if((mapStoreKey==='trip' && tripMiniMap!==m) || (mapStoreKey!=='trip' && miniMaps[mapStoreKey]!==m) || !document.body.contains(el))return;
    const line=L.geoJSON(j.geometry,{style:{weight:5,opacity:0.9},interactive:false}).addTo(m);
    const bounds=line.getBounds();
    if(bounds.isValid())m._cgRouteBounds=bounds;

    // 不在這裡立刻 fitBounds；交給 refitStableMiniMap()，
    // 讓 iPhone 的 visual viewport / layout 先穩定。
    refitStableMiniMap(m,{force:true});

    const km=(j.distanceMeters/1000).toFixed(j.distanceMeters>=10000?1:2);
    const mins=Math.max(1,Math.round(j.durationSeconds/60));
    if(summary)summary.innerHTML=`🛣️ 約 <b>${km} km</b>・<b>${mins} 分鐘</b>`;
  }catch(e){
    console.warn('mini route preview failed',mapStoreKey,e);
    if((mapStoreKey==='trip' && tripMiniMap!==m) || (mapStoreKey!=='trip' && miniMaps[mapStoreKey]!==m) || !document.body.contains(el))return;
    const fallbackLine=L.polyline([start,end],{weight:4,dashArray:'7 7',opacity:0.7,interactive:false}).addTo(m);
    const fallbackBounds=fallbackLine.getBounds();
    if(fallbackBounds.isValid())m._cgRouteBounds=fallbackBounds;
    refitStableMiniMap(m,{force:true});
    if(summary){summary.classList.add('text-warning');summary.textContent='⚠️ 道路路線暫時無法取得，先顯示起終點直線。';}
  }

  // 再做幾次尺寸校正，涵蓋 iPhone Safari / LINE WebView
  // 上下工具列收合造成的 visualViewport resize。
  setTimeout(()=>refitStableMiniMap(m,{force:true}),60);
  setTimeout(()=>refitStableMiniMap(m,{force:true}),220);
  setTimeout(()=>refitStableMiniMap(m,{force:true}),520);
}

function mapContainerIsUsable(m){
  try{
    const el=m?.getContainer?.();
    if(!el || !document.body.contains(el))return false;
    const rect=el.getBoundingClientRect();
    return rect.width>=120 && rect.height>=100;
  }catch(e){
    return false;
  }
}

function refitStableMiniMap(m,{force=false}={}){
  if(!m || !mapContainerIsUsable(m))return;

  try{
    // pan:false 很重要：只更新 Leaflet 尺寸快取，不先把中心點平移掉。
    m.invalidateSize({pan:false,animate:false});

    const bounds=(m._cgRouteBounds?.isValid?.() ? m._cgRouteBounds : m._cgFallbackBounds);
    if(bounds?.isValid?.()){
      // 小尺寸手機 padding 要小，不然 375px 寬的 viewport 會把可用區吃掉太多。
      const width=m.getContainer().getBoundingClientRect().width;
      const pad=width<=390 ? 10 : (width<=480 ? 14 : 22);
      m.fitBounds(bounds,{
        padding:[pad,pad],
        animate:false,
        maxZoom:17
      });
    }
  }catch(e){
    console.warn('refitStableMiniMap failed',e);
  }
}

function detachTripMapResizeWatcher(){
  if(tripMapResizeObserver){
    try{tripMapResizeObserver.disconnect()}catch(e){}
    tripMapResizeObserver=null;
  }
  if(tripMapRefitTimer){
    clearTimeout(tripMapRefitTimer);
    tripMapRefitTimer=null;
  }
}

function attachTripMapResizeWatcher(){
  detachTripMapResizeWatcher();
  const el=document.getElementById('tripMiniMap');
  if(!el || !tripMiniMap)return;

  const schedule=()=>{
    if(tripMapRefitTimer)clearTimeout(tripMapRefitTimer);
    tripMapRefitTimer=setTimeout(()=>{
      if(tripMiniMap && document.getElementById('trip').style.display!=='none'){
        refitStableMiniMap(tripMiniMap,{force:true});
      }
    },90);
  };

  // 元素實際寬高改變時重新 fit；比只監聽 window.resize 更準。
  if('ResizeObserver' in window){
    tripMapResizeObserver=new ResizeObserver(()=>schedule());
    tripMapResizeObserver.observe(el);
  }

  // iOS Safari / LINE WebView 的地址列收合不一定觸發普通 resize，
  // visualViewport.resize 才會收到。
  if(window.visualViewport && !window.__cgTripVisualViewportBound){
    window.__cgTripVisualViewportBound=true;
    window.visualViewport.addEventListener('resize',()=>{
      if(tripMiniMap && document.getElementById('trip').style.display!=='none'){
        schedule();
      }
    },{passive:true});
  }

  if(!window.__cgTripWindowResizeBound){
    window.__cgTripWindowResizeBound=true;
    window.addEventListener('resize',()=>{
      if(tripMiniMap && document.getElementById('trip').style.display!=='none'){
        schedule();
      }
    },{passive:true});
    window.addEventListener('orientationchange',()=>{
      setTimeout(schedule,180);
      setTimeout(schedule,500);
    },{passive:true});
  }
}

async function recreateTripMiniMapVisible(){
  if(!active)return;
  const section=document.getElementById('trip');
  const el=document.getElementById('tripMiniMap');
  if(!section||section.style.display==='none'||!el)return;

  // 真正可見後再等兩個 frame + 短延遲，讓 iPhone Safari / LINE 的 viewport 完成 layout。
  await new Promise(resolve=>{
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        setTimeout(resolve,120);
      });
    });
  });

  if(document.getElementById('trip').style.display==='none')return;

  const rect=el.getBoundingClientRect();
  if(rect.width<150 || rect.height<120){
    // 再給 iOS 一點時間，最多重試一次。
    await new Promise(r=>setTimeout(r,220));
  }

  // 每次「進入行程 Tab」才重建一次。
  // 不在每 2 秒 refresh 重建，所以不會抖。
  detachTripMapResizeWatcher();
  if(tripMiniMap){
    try{tripMiniMap.remove()}catch(e){}
    tripMiniMap=null;
  }

  await renderStaticRouteMiniMap({
    mapEl:'tripMiniMap',
    summaryEl:'tripMiniRouteSummary',
    ride:active,
    mapStoreKey:'trip'
  });

  // route layer / bounds 已完成後，最後做一次穩定 fit。
  setTimeout(()=>refitStableMiniMap(tripMiniMap,{force:true}),80);
  setTimeout(()=>refitStableMiniMap(tripMiniMap,{force:true}),260);
}

async function renderTripMiniMap(){

function hideAddressResults(target){
  const box=document.getElementById(`${target}SearchResults`);

}
function clearPlaceCoord(target){
  coords[target]=null;
  const status=document.getElementById(`${target}SearchStatus`);
  if(status){status.className='address-search-status';status.textContent='';}
  hideAddressResults(target);
}
function selectAddressResult(target,item,{keepList=false}={}){
  const input=document.getElementById(target);
  if(!input||!item||!Number.isFinite(+item.lat)||!Number.isFinite(+item.lng))return false;
  input.value=item.displayName||input.value;
  coords[target]={lat:+item.lat,lng:+item.lng};
  const status=document.getElementById(`${target}SearchStatus`);
  if(status){
    status.className='address-search-status text-success';
    status.textContent=`✓ 已定位：${(+item.lat).toFixed(6)}, ${(+item.lng).toFixed(6)}`;
  }
  if(!keepList)hideAddressResults(target);
  return true;
}
async function geocodeTextValue(target,{autoSelect=true,showCandidates=true}={}){
  const input=document.getElementById(target);
  const status=document.getElementById(`${target}SearchStatus`);
  const box=document.getElementById(`${target}SearchResults`);
  const q=(input?.value||'').trim();
  if(!q)throw Error('請先輸入地址或地名');

  if(status){status.className='address-search-status';status.textContent='🔎 正在查地址…';}
  if(box){box.style.display='none';box.innerHTML='';}

  const j=await api(`/geocode/?q=${encodeURIComponent(q)}`,{method:'GET',timeoutMs:12000});
  const rows=(j.results&&j.results.length)?j.results:[{lat:j.lat,lng:j.lng,displayName:j.displayName}];
  const valid=rows.filter(r=>Number.isFinite(+r.lat)&&Number.isFinite(+r.lng));
  if(!valid.length)throw Error('找不到可用的位置');

  window.__addressSearchResults=window.__addressSearchResults||{};
  window.__addressSearchResults[target]=valid;

  // 放大鏡的主要動作：立即採用最佳第一筆，讓使用者可以直接建立共乘。
  if(autoSelect)selectAddressResult(target,valid[0],{keepList:showCandidates&&valid.length>1});

  // 同時保留候選清單，若第一筆不正確可再點別筆。
  if(showCandidates&&box&&valid.length>1){
    box.innerHTML=valid.map((r,i)=>`<div class="address-result" tabindex="0" data-index="${i}" onclick="selectAddressResult('${target}',window.__addressSearchResults['${target}'][${i}])" onkeydown="if(event.key==='Enter')selectAddressResult('${target}',window.__addressSearchResults['${target}'][${i}])">📍 ${esc(r.displayName||q)}</div>`).join('');
    box.style.display='block';
    if(status)status.textContent=`✓ 已採用第 1 筆；另有 ${valid.length-1} 筆候選可改選`;
  }
  return valid[0];
}
async function searchAddress(target){
  try{
    await geocodeTextValue(target,{autoSelect:true,showCandidates:true});
  }catch(e){
    hideAddressResults(target);
    const status=document.getElementById(`${target}SearchStatus`);
    if(status){status.className='address-search-status error';status.textContent='查地址失敗：'+e.message;}
    console.warn('searchAddress failed',target,e);
  }
}

async function ensurePlaceCoord(target){
  if(coords[target] && Number.isFinite(+coords[target].lat) && Number.isFinite(+coords[target].lng))return coords[target];

  const input=document.getElementById(target);
  const q=(input?.value||'').trim();

  // 「目前位置附近集合點」優先使用瀏覽器最近 GPS，不拿這句文字去做地址搜尋。
  if(target==='meet' && /目前位置/.test(q) && lastBrowserLocation){
    coords.meet={lat:+lastBrowserLocation.lat,lng:+lastBrowserLocation.lng};
    const status=document.getElementById('meetSearchStatus');
    if(status){status.className='address-search-status text-success';status.textContent='✓ 已使用目前位置';}
    return coords.meet;
  }

  // 使用者只打字、沒按放大鏡也沒關係：建立前自動做一次地址解析。
  const first=await geocodeTextValue(target,{autoSelect:true,showCandidates:false});
  return coords[target]||{lat:+first.lat,lng:+first.lng};
}

async function createRide(){
  const btn=document.getElementById('createRideBtn');
  const status=document.getElementById('createStatus');
  const el=id=>document.getElementById(id);

  if(btn.disabled)return;
  btn.disabled=true;
  btn.textContent='建立中…';
  status.className='small mt-2 text-muted';
  status.textContent='正在確認集合點與目的地…';

  try{
    if(!el('date').value||!el('time').value)throw Error('請先選擇日期與時間');
    if(!el('meet').value.trim())throw Error('請輸入集合點');
    if(!el('dest').value.trim())throw Error('請輸入目的地');

    // 重要修正：不再強迫一定要先按「精確選」。
    // 若只有輸入地址，建立前會自動查地址取得座標。
    const [meetCoord,destCoord]=await Promise.all([
      ensurePlaceCoord('meet'),
      ensurePlaceCoord('dest')
    ]);

    if(!meetCoord||!destCoord)throw Error('集合點或目的地無法定位，請按 🔎 或 🗺️ 選位置');

    const d={
      date:el('date').value,
      time:el('time').value,
      maxPeople:+el('max').value,
      meetingName:el('meet').value.trim(),
      destinationName:el('dest').value.trim(),
      mode:el('mode').value,
      estimatedTotal:+el('fare').value||0,
      note:el('note').value,
      meetingLat:+meetCoord.lat,
      meetingLng:+meetCoord.lng,
      destinationLat:+destCoord.lat,
      destinationLng:+destCoord.lng
    };

    if(![d.meetingLat,d.meetingLng,d.destinationLat,d.destinationLng].every(Number.isFinite))throw Error('位置座標無效，請重新查地址或精確選點');
    if(Math.abs(d.meetingLat-d.destinationLat)<1e-7 && Math.abs(d.meetingLng-d.destinationLng)<1e-7)throw Error('集合點與目的地不能完全相同');

    status.textContent='位置確認完成，正在建立共乘…';
    const result=await api('/rides/',{method:'POST',body:JSON.stringify(d),timeoutMs:15000});
    if(!result?.ride?.id)throw Error('伺服器沒有回傳建立結果');

    active=result.ride;
    status.className='small mt-2 text-success';
    status.textContent=`✅ 已建立共乘 #${result.ride.id}`;

    // 成功後直接切到「行程」而不是先做多個背景 API 再決定。
    tab('trip');
    Promise.allSettled([loadRides(),loadTrip()]).then(()=>{});
  }catch(e){
    console.error('createRide failed',e);
    status.className='small mt-2 text-danger';
    status.textContent='建立失敗：'+e.message;
    alert('建立共乘失敗：'+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent='建立共乘';
  }
}

async function loadTrip(){
  const j=await api('/my-trip/');

  // 若目前行程改變（加入新群組、離開/取消舊群組），舊群組未讀數不可帶過來。
  if(String(previousActiveId ?? '')!==String(active?.id ?? '')){
    resetUnreadForRide(active?.id ?? null);
    chatSeenIds=new Set();
  }else{
    resetUnreadForRide(active?.id ?? null);
  }

  homeEmpty.style.display=active?'none':'';
  homeTrip.style.display=active?'':'none';

  const nextSig=tripStaticSignature(active);

  if(!active){
    tripRenderSignature='none';
    if(tripMiniMap){detachTripMapResizeWatcher();try{tripMiniMap.remove()}catch(e){};tripMiniMap=null;}
    tripBox.innerHTML='<div class="card p-4"><b>目前沒有「我已加入」的共乘行程。</b><div class="text-muted mt-2">其他使用者建立的募集請到「找共乘」查看。</div><button class="btn btn-success mt-3" onclick="tab(\'find\')">🔎 查看可加入共乘</button></div>';

    unreadRideId=null;
    unreadCount=0;
    updateUnread();
    chatBox.innerHTML='加入共乘後可使用訊息';
    renderChatMembers();
    return;
  }

  // 2026-10-05 修正：
  // refresh() 每 2 秒仍可抓最新資料，但「同一筆行程、同一路線」不再重建 Leaflet。
  // 只有行程 / 起終點真的改變時才重畫路線小圖。
  const needStaticRebuild = nextSig!==tripRenderSignature || !document.getElementById('tripMiniMap');

  if(needStaticRebuild){
    tripRenderSignature=nextSig;
    if(tripMiniMap){detachTripMapResizeWatcher();try{tripMiniMap.remove()}catch(e){};tripMiniMap=null;}

    tripBox.innerHTML=`
      <div class="card p-3">
        <h4>🚩 集合時間 ${esc(active.time)}</h4>
        <div>🚩 起點：${esc(active.meeting.name)}</div>
        <div>↓</div>
        <div>🏁 Goal：${esc(active.destination.name)}</div>
        <div class="mini-title">🗺️ 路線預覽</div>
        <div id="tripMiniMap" class="mini border" aria-label="我的行程路線小圖"></div>
        <div id="tripMiniRouteSummary" class="small text-muted mt-1">🛣️ 正在取得道路路線…</div>
      </div>
      <div id="tripMembersBox" class="card p-3 mt-3"></div>`;

    renderTripMembersOnly();

    // 這裡只建立行程文字與地圖容器。
    // Leaflet 一律等使用者真的進入「行程」Tab 後由 recreateTripMiniMapVisible() 建立。
  }else{
    // 每 2 秒只更新成員名單/人數，完全不碰 Leaflet。
    renderTripMembersOnly();
  }

  renderChatMembers();

  // 首頁目前真的可見時才更新大地圖，避免在「行程」頁背景反覆 fitBounds。
  if(document.getElementById('home').style.display!=='none'){
    renderHome();
  }

  // vNext：訊息與定位改由 refresh() 各自節流；loadTrip 不再造成連鎖 API 請求或 GPS 重複寫入。
  ensureMqttForActive();
}

// 2026-10-05：恢復「共乘路線預覽」。
// 由 Django 後端代理 OSRM 路線服務，回傳 GeoJSON LineString，再用 Leaflet 畫在首頁地圖。
async function loadRoutePreview(){
  if(!active||!homeMap)return;
  const box=document.getElementById('routeSummary');
  const a=active.meeting,b=active.destination;
  if(a.lat==null||a.lng==null||b.lat==null||b.lng==null){
    if(box){box.classList.add('route-error');box.textContent='⚠️ 這筆共乘缺少集合點或目的地座標，無法畫出道路路線。請重新用「精確選」設定兩端位置。';}
    return;
  }
  try{
    const q=`/route/?start_lat=${encodeURIComponent(a.lat)}&start_lng=${encodeURIComponent(a.lng)}&end_lat=${encodeURIComponent(b.lat)}&end_lng=${encodeURIComponent(b.lng)}`;
    const j=await api(q,{method:'GET',timeoutMs:15000});
    if(routeLayer){homeMap.removeLayer(routeLayer);routeLayer=null;}
    // GeoJSON 座標順序是 [lng, lat]，Leaflet L.geoJSON 會自動正確轉換。
    routeLayer=L.geoJSON(j.geometry,{style:{weight:6,opacity:0.88}}).addTo(homeMap);
    const bounds=routeLayer.getBounds();
    homeRouteBounds=bounds.isValid()?bounds:null;
    fitHomeToAll();
    const km=(j.distanceMeters/1000).toFixed(j.distanceMeters>=10000?1:2);
    const mins=Math.max(1,Math.round(j.durationSeconds/60));
    if(box){box.classList.remove('route-error');box.innerHTML=`🛣️ 道路路線：約 <b>${km} km</b>・預估 <b>${mins} 分鐘</b><br><span class="text-muted">藍色路徑為開車導航預覽，實際路況與行車時間仍以當下導航為準。</span>`;}
  }catch(e){
    console.warn('route preview failed',e);
    // 路由服務暫時失敗時至少保留起終點，避免整張圖空白。
    if(routeLayer){homeMap.removeLayer(routeLayer);routeLayer=null;}
    routeLayer=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{weight:4,dashArray:'8 8',opacity:0.7}).addTo(homeMap);
    homeRouteBounds=routeLayer.getBounds();
    fitHomeToAll();
    if(box){box.classList.add('route-error');box.textContent='⚠️ 道路路線服務目前無法取得，先以起點到終點虛線顯示。稍後重新整理會再嘗試。';}
  }
}
function rideStartDateTime(r){
  if(!r||!r.date||!r.time)return null;
  const d=new Date(`${r.date}T${r.time}:00`);
  return Number.isNaN(d.getTime())?null:d;
}
function isLiveTrackingWindow(r){

  // 只要這是目前使用者最近加入且仍為 open/full 的共乘，就永遠啟用即時地圖。

}
function locationTopic(rideId){return `${MQTT_ROOT}/ride/${rideId}/location`}
function makePersonIcon(x){
  const mine=x.clientId===cid;
  const fullName=mine?'我':(x.nickname||('使用者-'+String(x.clientId||'').slice(-4)));
  const safeName=esc(fullName);

  // 2026-10-05 UI 修正：
  // 多位共乘者若 GPS 幾乎在同一位置，原本 Marker 會完全疊住，看起來像只有 1 人。
  // 這裡只做「畫面上的像素位移」，不修改真實 GPS 座標。
  const nearby=[];
  for(const [id,loc] of liveLocationCache){
    if(!loc||loc.lat==null||loc.lng==null)continue;
    const dLat=(+loc.lat)-(+x.lat);
    const dLng=(+loc.lng)-(+x.lng);
    // 約十幾公尺內視為會互相遮住的群組。
    if(Math.abs(dLat)<0.00012 && Math.abs(dLng)<0.00012)nearby.push(id);
  }
  if(!nearby.includes(x.clientId))nearby.push(x.clientId);
  nearby.sort();
  const idx=nearby.indexOf(x.clientId);
  const center=(nearby.length-1)/2;
  const dx=Math.round((idx-center)*48);
  const dy=nearby.length>2 ? Math.round((idx%2)*8) : 0;

  return L.divIcon({
    // 2026-10-05 修正：外層 divIcon 不要有任何可見面積或背景，
    // 避免 Leaflet/瀏覽器樣式產生綠色或半透明矩形底。
    className:'live-member-div-icon',
    html:`<div class="live-member-marker ${mine?'mine':'other'}" style="--marker-dx:${dx}px;--marker-dy:${dy}px"><div class="bubble">${mine?'我':'👤'}</div>${mine?'':`<div class="name">${safeName}</div>`}</div>`,
    iconSize:[0,0],
    iconAnchor:[0,0]
  });
}
function fitHomeToAll(){
  if(!active||!homeMap)return;
  const pts=[];
  const add=(lat,lng)=>{lat=+lat;lng=+lng;if(Number.isFinite(lat)&&Number.isFinite(lng))pts.push([lat,lng]);};
  if(active.meeting) add(active.meeting.lat,active.meeting.lng);
  if(active.destination) add(active.destination.lat,active.destination.lng);
  const validIds=new Set((active.members||[]).map(m=>m.clientId));
  for(const [id,loc] of liveLocationCache){
    if(validIds.has(id)) add(loc.lat,loc.lng);
  }
  if(pts.length===1){homeMap.setView(pts[0],16);return;}
  if(pts.length>=2){
    const b=L.latLngBounds(pts);
    // 若路徑本身有更大的 bounds，也一起納入。
    if(homeRouteBounds&&homeRouteBounds.isValid())b.extend(homeRouteBounds);
    homeMap.fitBounds(b,{padding:[55,55],maxZoom:16});
  }
}
function rebuildLiveMemberMarkers(){
  if(!active||!homeMap)return;
  const validIds=new Set((active.members||[]).map(m=>m.clientId));
  for(const [id,loc] of liveLocationCache){
    if(!validIds.has(id)||!loc||loc.lat==null||loc.lng==null)continue;
    const k='u'+id;
    if(markers[k]){try{homeMap.removeLayer(markers[k])}catch(e){}}
    markers[k]=L.marker([+loc.lat,+loc.lng],{icon:makePersonIcon(loc),zIndexOffset:900}).addTo(homeMap)
      .bindPopup(`<b>${id===cid?'我':esc(loc.nickname||id)}</b><br>📍 即時定位${loc.accuracy?`<br>精度約 ±${Math.round(loc.accuracy)} m`:''}`);
  }
}
function upsertLiveLocation(x,{fromMqtt=false}={}){
  if(!active||!homeMap||!x||x.lat==null||x.lng==null)return;
  liveLocationCache.set(x.clientId,x);
  // 重新計算同位置成員的視覺位移，避免兩個圈圈完全疊在一起。
  rebuildLiveMemberMarkers();
  renderLiveLegend();
  fitHomeToAll();
}
function renderLiveLegend(){
  const el=document.getElementById('liveTrackingLegend');if(!el||!active)return;
  if(!isLiveTrackingWindow(active)){el.innerHTML='';return;}
  const memberIds=new Set(active.members.map(m=>m.clientId));
  const rows=[];
  active.members.forEach(m=>{
    const loc=liveLocationCache.get(m.clientId);
    let freshness='';
    if(loc&&loc.updatedAt){
      const age=Math.max(0,Math.round((Date.now()-new Date(loc.updatedAt).getTime())/1000));
      freshness=Number.isFinite(age)?`（${age<60?age+' 秒前':Math.floor(age/60)+' 分前'}）`:'';
    }
    rows.push(`<span class="live-person ${loc?(m.clientId===cid?'me':'other'):'offline'}">${loc?'●':'○'} ${m.clientId===cid?'我':esc(m.nickname)}${loc?freshness:'・尚未定位'}</span>`);
  });
  el.innerHTML=rows.join('');
}

// 2026-10-05：修正「一直尚未分享定位」。
// 瀏覽器在尚未加入共乘時取得的 GPS 也先保留；加入/重新整理行程後立即補送。
function rememberBrowserLocation(lat,lng,accuracy){
  lastBrowserLocation={
    lat:+lat,
    lng:+lng,
    accuracy:accuracy==null?null:+accuracy,
    updatedAt:new Date().toISOString()
  };
}
function updateLocationStatus(msg,isError=false){
  const el=document.getElementById('liveTrackingStatus');
  if(!el)return;
  el.classList.toggle('off',!!isError);
  el.innerHTML=msg;
}
function onBrowserLocation(pos){
  const c=pos.coords;
  rememberBrowserLocation(c.latitude,c.longitude,c.accuracy);
  updateLocationStatus(`📡 已取得本機定位：精度約 ±${Math.round(c.accuracy||0)} m；有行程時會自動分享給共乘成員。`,false);
  if(active)pushLoc(c.latitude,c.longitude,c.accuracy);
}
function onBrowserLocationError(err){
  let reason='無法取得定位';
  if(err){
    if(err.code===1)reason='瀏覽器定位權限被拒絕';
    else if(err.code===2)reason='目前無法取得裝置位置';
    else if(err.code===3)reason='取得定位逾時';
  }
  const insecure=(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'&&location.protocol!=='https:');
  if(insecure)reason+='；區網 HTTP 網址可能被瀏覽器限制定位，請改用 localhost/127.0.0.1 或 HTTPS';
  updateLocationStatus(`⚠️ ${reason}。請點「重新分享我的定位」並允許位置權限。`,true);
  console.warn('geolocation error',err);
  renderLiveLegend();
}
function startGeolocationWatch(){

function distanceMeters(a,b){
  if(!a||!b)return Infinity;
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

async function pushLoc(lat,lng,accuracy,{force=false}={}){
  rememberBrowserLocation(lat,lng,accuracy);
  if(!active||!isLiveTrackingWindow(active))return;
  const rideId=active.id;
  const payload={clientId:cid,nickname:me?.nickname||'',lat:+lat,lng:+lng,accuracy:accuracy==null?null:+accuracy,updatedAt:new Date().toISOString()};
  upsertLiveLocation(payload);

  // vNext：瀏覽器 watchPosition 可能每秒回報且座標只有 GPS 漂移。
  // 本機 marker 仍可立即更新，但 DB 只在「移動 >=15m」且距上次寫入 >=3秒時保存。
  const now=Date.now();
  const moved=distanceMeters(lastSavedLocation,{lat:+lat,lng:+lng});
  const shouldSave=force || !lastSavedLocation ||
    (moved>=GPS_MIN_MOVE_METERS && now-lastLocationSaveAt>=GPS_MIN_SAVE_INTERVAL_MS);

  if(shouldSave && !locationSaveBusy){
    locationSaveBusy=true;
    try{
      await api(`/rides/${rideId}/locations/`,{
        method:'POST',
        body:JSON.stringify({lat:+lat,lng:+lng,accuracy:accuracy==null?null:+accuracy})
      });
      lastSavedLocation={lat:+lat,lng:+lng};
      lastLocationSaveAt=Date.now();

      // 前一次若顯示 500/逾時警告，只要下一次寫入成功就自動恢復正常狀態。
      updateLocationStatus(`📡 定位同步正常：GPS 精度約 ±${Math.round(accuracy||0)} m。`,false);
    }catch(e){
      console.warn('save live location failed',e);
      updateLocationStatus('⚠️ 已取得 GPS，但寫入 Django 定位資料失敗：'+e.message,true);
    }finally{
      locationSaveBusy=false;
    }
  }

  // MQTT 即時廣播；資料庫仍是主要備援。
  const mqttNow=Date.now();
  if(mqttClient&&mqttConnected&&mqttNow-lastLocationPublishAt>=1500){
    lastLocationPublishAt=mqttNow;
    try{
      mqttClient.publish(locationTopic(rideId),JSON.stringify({type:'location',rideId,...payload}),{qos:0,retain:false});
    }catch(e){console.warn('publish live location failed',e)}
  }
}

function isMessageFromCurrentJoinedGroup(topic,data){
  if(!active||!mqttRideId)return false;

  const currentId=String(active.id);
  if(String(mqttRideId)!==currentId)return false;

  // Topic 必須精確屬於目前行程。
  const prefix=`${MQTT_ROOT}/ride/${currentId}/`;
  if(typeof topic!=='string'||!topic.startsWith(prefix))return false;

  // Payload 若帶 rideId，也必須完全相同。
  if(data?.rideId!=null && String(data.rideId)!==currentId)return false;

  // Chat sender 必須是目前共乘成員，避免公共 MQTT Broker 上其他群組/偽造訊息被計入。
  if(data?.message?.senderId!=null){
    const ids=activeMemberIds();
    if(!ids.has(String(data.message.senderId)))return false;
  }

  return true;
}

  return `${hh}:${mm}`;
}

function rideTopic(rideId){return `${MQTT_ROOT}/ride/${rideId}/#`}
function chatTopic(rideId){return `${MQTT_ROOT}/ride/${rideId}/chat`}
function eventTopic(rideId){return `${MQTT_ROOT}/ride/${rideId}/event`}
function disconnectMqttRide(){
  // 每次斷線都增加 generation，讓舊 client 尚在 queue 的 message callback 立刻失效。
  mqttGeneration++;
  mqttRideId=null;
  mqttConnected=false;

  if(mqttClient){
    const old=mqttClient;
    mqttClient=null;
    try{old.removeAllListeners?.()}catch(e){}
    try{old.end(true)}catch(e){}
  }

  setMqttStatus('MQTT：尚未加入共乘',false);
}
async function ensureMqttForActive(){
  if(!active)return disconnectMqttRide();
  if(mqttClient&&mqttRideId===active.id)return;
  disconnectMqttRide();
  mqttRideId=active.id;
  resetUnreadForRide(active.id);

  if(typeof mqtt==='undefined'){setMqttStatus('MQTT 程式庫載入失敗；目前改用 API 定期同步',false);return;}

  const connectionRideId=String(active.id);
  const generation=++mqttGeneration;

  try{
    const client=mqtt.connect(MQTT_BROKER,{clientId:`cg_${cid.replace(/[^a-zA-Z0-9]/g,'').slice(-16)}_${Math.random().toString(16).slice(2,8)}`,clean:true,connectTimeout:5000,reconnectPeriod:2000,keepalive:30});
    mqttClient=client;

    client.on('connect',()=>{
      if(generation!==mqttGeneration)return;
      if(!active||String(mqttRideId)!==connectionRideId||String(active.id)!==connectionRideId)return;
      mqttConnected=true;
      setMqttStatus(`MQTT：已即時連線（行程 #${active.id}）`,true);
      client.subscribe(rideTopic(connectionRideId),{qos:0},err=>{
        if(generation!==mqttGeneration)return;
        if(err)setMqttStatus('MQTT 訂閱失敗；仍會用 API 同步',false);
      });
    });
    client.on('reconnect',()=>{
      if(generation!==mqttGeneration)return;
      setMqttStatus('MQTT：重新連線中…',false);
    });
    client.on('offline',()=>{
      if(generation!==mqttGeneration)return;
      mqttConnected=false;
      setMqttStatus('MQTT：離線，暫以 API 同步',false);
    });
    client.on('error',e=>{
      if(generation!==mqttGeneration)return;
      mqttConnected=false;
      setMqttStatus('MQTT：連線異常，暫以 API 同步',false);
      console.warn('mqtt error',e);
    });
    client.on('message',(topic,payload)=>{
      // 關鍵修正：舊 MQTT client、其他 ride topic、非目前成員訊息全部忽略。
      if(generation!==mqttGeneration)return;
      if(!active||String(active.id)!==connectionRideId||String(mqttRideId)!==connectionRideId)return;

      try{
        const data=JSON.parse(new TextDecoder().decode(payload));
        if(!isMessageFromCurrentJoinedGroup(topic,data))return;

        if(topic===chatTopic(connectionRideId)&&data.message){
          renderChatMessage(data.message,{realtime:true,sourceRideId:connectionRideId});
        }
        if(topic===locationTopic(connectionRideId)&&data.type==='location'&&isLiveTrackingWindow(active)){
          upsertLiveLocation(data,{fromMqtt:true});
        }
        if(topic===eventTopic(connectionRideId)&&data.type==='member_update'){
          loadTrip().catch(()=>{});
        }
      }catch(e){console.warn('mqtt message parse failed',e)}
    });
  }catch(e){setMqttStatus('MQTT：無法建立連線，暫以 API 同步',false);console.warn(e)}
}

  if(!active||!mqttClient||!mqttConnected)return;

  const el=document.getElementById('pickStatus'); if(el)el.textContent='正在取得目前位置…';
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
    pickSuppressMoveEnd=true;
    pickMap.setView(ll,18,{animate:false});
    setPickPoint(ll,false,true);
    setTimeout(()=>{pickSuppressMoveEnd=false},80);
    if(el)el.innerHTML=`📍 目前位置：<b>${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}</b>，GPS 精度約 ${Math.round(pos.coords.accuracy||0)} m`;
  },err=>{if(el)el.textContent='無法取得目前位置';alert('定位失敗：'+err.message+'。請確認瀏覽器已允許位置權限。')},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
function confirmPick(){
  if(!pickMarker)return alert('請先拖曳地圖選位置，或按「目前位置」');
  const p=pickMarker.getLatLng();
  coords[pickTarget]={lat:p.lat,lng:p.lng};
  const input=document.getElementById(pickTarget);
  // 2026-10-05 修正：精確選點後，若反向地理編碼成功，就把「真正地址」回填到集合點/目的地。
  // 若 Nominatim 暫時不可用，至少保留原文字，不會把欄位變空白。
  if(pickAddressText)input.value=pickAddressText;
  else if(!input.value.trim())input.value=pickTarget==='meet'?'自訂上車點':'自訂目的地';
  input.dataset.lat=String(p.lat);
  input.dataset.lng=String(p.lng);
  closePickModal();
}
let refreshBusy=false;
async function refresh(){
  if(document.visibilityState!=='visible'||refreshBusy)return;
  refreshBusy=true;
  try{
    const now=Date.now();

    // 行程本體 5 秒更新一次。MQTT 的 member_update 仍可在成員異動時立即觸發 loadTrip()。
    if(now-lastTripPollAt>=POLL_TRIP_MS){
      lastTripPollAt=now;
      await loadTrip();
    }

    // 「找共乘」只有頁面可見時才抓，而且最多 5 秒一次。
    if(find.style.display!=='none' && now-lastRidesPollAt>=POLL_RIDES_MS){
      lastRidesPollAt=now;
      await loadRides();
    }

    if(active){
      // 成員位置 3 秒一次；MQTT 正常時中間位置仍會即時更新 marker。
      if(now-lastLocationsPollAt>=POLL_LOCATIONS_MS){
        lastLocationsPollAt=now;
        await loadLocs();
      }

      // 歷史訊息/API 備援 5 秒一次；即時訊息主要走 MQTT。
      if(now-lastMessagesPollAt>=POLL_MESSAGES_MS){
        lastMessagesPollAt=now;
        await loadMsgs();
      }
    }
  }catch(e){
    console.warn('refresh failed',e);
  }finally{
    refreshBusy=false;
  }
}
init();

function verifyCoreActions(){
  const required=['searchAddress','pick','createRide','joinRide','cancelRide'];
  const missing=required.filter(name=>typeof window[name]!=='function');
  if(missing.length){
    console.error('Core actions missing:',missing);
  }
}
setTimeout(verifyCoreActions,0);
